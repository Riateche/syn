[package]
name = "trace-var"
version = "0.0.0"
authors = ["David Tolnay <dtolnay@gmail.com>"]
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { package = "proc-macro2-send", git = "https://github.com/Riateche/proc-macro2.git", branch = "send", features = ["nightly"] }
quote = { package = "quote-send", git = "https://github.com/Riateche/quote.git", branch = "send", optional = true }
syn = { package = "syn-send", path = "../../../", features = ["fold", "full"] }
